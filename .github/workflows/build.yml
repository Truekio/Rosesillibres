name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleRelease :acciones:assembleRelease :sector:assembleRelease :chollos:assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Tareas.apk
          cp acciones/build/outputs/apk/release/acciones-release.apk Acciones.apk
          cp sector/build/outputs/apk/release/sector-release.apk Sector.apk
          cp chollos/build/outputs/apk/release/chollos-release.apk Chollos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tareas-apk
          path: |
            Tareas.apk
            Acciones.apk
            Sector.apk
            Chollos.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Tareas.apk Acciones.apk Sector.apk Chollos.apk \
            --title "Apps v${{ github.run_number }}" \
            --notes "Tareas.apk, Acciones.apk, Sector.apk y Chollos.apk, listos para instalar" --latest
